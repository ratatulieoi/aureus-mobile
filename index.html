
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Match the native launch background until the app stylesheet loads. -->
    <style>:where(html) { background: #0d110e; }</style>
    <script>
      (() => {
        let theme;
        try { theme = window.localStorage.getItem('theme'); } catch { /* Storage may be unavailable. */ }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia?.('(prefers-color-scheme: dark)')?.matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(theme);
      })();
    </script>
    <title>Aureus</title>
    <meta name="description" content="Aplikasi pencatat pemasukan & pengeluaran." />
    <meta name="author" content="Aureus" />
    <meta name="theme-color" content="#0d110e" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aureus" />
    <meta property="og:description" content="Aplikasi pencatat pemasukan & pengeluaran." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brand/aureus-app-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
