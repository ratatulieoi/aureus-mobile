name: Android quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Web and Android gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      TZ: Asia/Jakarta

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify npm toolchain
        run: |
          test "$(node --version)" = "v22.22.3"
          test "$(npm --version)" = "10.9.8"

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21.0.8+9'
          cache: gradle

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install exact npm graph
        run: npm ci

      - name: Run aggregate application gate
        run: npm run check

      - name: Enforce dependency audit policy
        run: |
          npm run audit:prod
          npm run audit:all

      - name: Generate deterministic npm SBOM
        run: npm run sbom

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Check npm lockfile drift
        run: |
          before="$(sha256sum package-lock.json)"
          npm install --package-lock-only --ignore-scripts
          after="$(sha256sum package-lock.json)"
          test "$before" = "$after"

      - name: Run Android unit tests, lint, and debug assembly
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug processDebugMainManifest

      - name: Assert merged manifest security policy
        run: node scripts/assert-merged-manifest.mjs android/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml

      - name: Verify diagnostic APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256

      - name: Upload diagnostic APK and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aureus-debug-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            aureus-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7
