name: Android quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Web and Android gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      TZ: Asia/Jakarta

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify npm toolchain
        run: |
          test "$(node --version)" = "v22.22.3"
          test "$(npm --version)" = "10.9.8"

      - name: Setup Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install exact npm graph
        run: npm ci

      - name: Run aggregate application gate
        run: npm run check

      - name: Enforce dependency audit policy
        run: |
          npm run audit:prod
          npm run audit:all

      - name: Generate deterministic npm SBOM
        run: npm run sbom

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Check npm lockfile drift
        run: |
          before="$(sha256sum package-lock.json)"
          npm install --package-lock-only --ignore-scripts
          after="$(sha256sum package-lock.json)"
          test "$before" = "$after"

      - name: Run Android unit tests, lint, and debug assembly
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug processDebugMainManifest

      - name: Assert merged manifest security policy
        run: node scripts/assert-merged-manifest.mjs android/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml

      - name: Verify diagnostic APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256

      - name: Upload diagnostic APK and SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aureus-debug-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            aureus-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7
