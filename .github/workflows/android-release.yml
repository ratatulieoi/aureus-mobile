name: Android APK release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'SemVer version name (for example 2.5.1)'
        required: true
        type: string
      version_code:
        description: 'Positive, monotonically increasing Android versionCode'
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and validate installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      TZ: Asia/Jakarta

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install exact npm graph
        run: npm ci

      - name: Derive and validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: node scripts/derive-version.mjs >> "$GITHUB_OUTPUT"

      - name: Run aggregate and audit gates
        run: |
          npm run check
          npm run audit:prod
          npm run audit:all

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Check npm lockfile drift
        run: |
          before="$(sha256sum package-lock.json)"
          npm install --package-lock-only --ignore-scripts
          after="$(sha256sum package-lock.json)"
          test "$before" = "$after"

      - name: Configure private APK signing
        env:
          KEYSTORE_BASE64: ${{ secrets.AUREUS_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AUREUS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUREUS_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AUREUS_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing Aureus release keystore'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing Aureus keystore password'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing Aureus key alias'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing Aureus key password'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aureus-release.p12"
          test -s "$RUNNER_TEMP/aureus-release.p12"
          {
            printf 'ORG_GRADLE_PROJECT_AUREUS_KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/aureus-release.p12"
            printf 'ORG_GRADLE_PROJECT_AUREUS_KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'ORG_GRADLE_PROJECT_AUREUS_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'ORG_GRADLE_PROJECT_AUREUS_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build and validate signed release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_AUREUS_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ORG_GRADLE_PROJECT_AUREUS_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease processReleaseMainManifest

      - name: Assert merged release manifest
        run: node scripts/assert-merged-manifest.mjs android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml

      - name: Package and verify installable APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          source_apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$source_apk"
          mkdir -p release-artifacts
          output="release-artifacts/aureus-v${VERSION_NAME}.apk"
          cp "$source_apk" "$output"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$output"

      - name: Upload validated APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aureus-apk-${{ steps.version.outputs.version_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload tag release handoff
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aureus-tag-release-${{ github.ref_name }}-${{ github.sha }}
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 1

  github-release:
    name: Publish installable APK
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download validated APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aureus-tag-release-${{ github.ref_name }}-${{ github.sha }}
          path: release-artifacts

      - name: Verify release file
        run: |
          test -s "release-artifacts/aureus-${{ github.ref_name }}.apk"
          test "$(find release-artifacts -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-artifacts/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: false
